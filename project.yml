name: Whirl
options:
  bundleIdPrefix: com.baiyanwu
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Whirl:
    type: application
    platform: macOS
    sources:
      - path: Whirl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baiyanwu.whirl
        PRODUCT_NAME: Whirl
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Whirl
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 baiyanwu"
    info:
      path: Whirl/Resources/Info.plist
      properties:
        CFBundleDisplayName: Whirl
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: Whirl/Resources/Whirl.entitlements
      properties:
        com.apple.security.app-sandbox: false
  WhirlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhirlTests
    dependencies:
      - target: Whirl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baiyanwu.whirl.tests
        GENERATE_INFOPLIST_FILE: YES
  WhirlUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: WhirlUITests
    dependencies:
      - target: Whirl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baiyanwu.whirl.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Whirl:
    build:
      targets:
        Whirl: all
        WhirlTests: [test]
    test:
      targets:
        - WhirlTests
  WhirlUITests:
    build:
      targets:
        Whirl: all
        WhirlUITests: [test]
    test:
      targets:
        - WhirlUITests
