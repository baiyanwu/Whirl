name: Release readiness

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate annotated tag and project version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the exact vX.Y.Z format."
            exit 1
          fi

          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Release tags must be annotated tags."
            exit 1
          fi

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match project version $project_version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not contained in origin/main."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- Whirl.xcodeproj

      - name: Reject executable build phases
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'PBXShellScriptBuildPhase' Whirl.xcodeproj/project.pbxproj; then
            echo "Release projects must not contain shell-script build phases."
            exit 1
          fi

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Whirl.xcodeproj \
            -scheme Whirl \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/WhirlTestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/WhirlTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Verify unsigned Release build
        run: |
          xcodebuild \
            -project Whirl.xcodeproj \
            -scheme Whirl \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/WhirlReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Whirl-release-readiness-diagnostics
          path: ${{ runner.temp }}/WhirlTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
