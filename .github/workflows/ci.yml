name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- Whirl.xcodeproj

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Whirl.xcodeproj \
            -scheme Whirl \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/WhirlTestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/WhirlTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Verify Release build
        run: |
          xcodebuild \
            -project Whirl.xcodeproj \
            -scheme Whirl \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/WhirlReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Whirl-test-diagnostics
          path: ${{ runner.temp }}/WhirlTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
