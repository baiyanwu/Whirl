name: 功能请求（简体中文）
description: 为 Whirl 提出范围明确的改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 希望解决哪个用户问题或工作流程限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 请描述能够解决该问题的最小改动。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你尝试过哪些变通办法或其他设计？
  - type: textarea
    id: scope
    attributes:
      label: 是否符合键盘优先定位
      description: 请说明该建议如何保持 Whirl 聚焦于应用切换和同一应用窗口切换的范围。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 Issue 和 Discussions，确认没有相同请求。
          required: true
        - label: 我愿意协助测试或实现此改动。
          required: false
