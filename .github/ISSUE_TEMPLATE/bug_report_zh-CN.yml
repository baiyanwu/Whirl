name: 错误报告（简体中文）
description: 报告 Whirl 中可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Whirl。请勿包含密码、私人窗口标题、签名材料或其他敏感数据。
  - type: input
    id: version
    attributes:
      label: Whirl 版本
      description: 请填写正式版本号或提交 SHA。
      placeholder: 0.1.0 或 abc1234
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: macOS 26.0
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Apple 芯片
      options:
        - M1 系列
        - M2 系列
        - M3 系列
        - M4 系列
        - M5 系列或更新型号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能够稳定触发问题的最短操作步骤。
      placeholder: |
        1. 配置……
        2. 按下……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 如有帮助，请附上已移除敏感信息的日志、截图或最小示例。
  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 Issue 和 Discussions，确认没有相同问题。
          required: true
        - label: 我已从日志和截图中移除私人信息。
          required: true
        - label: 这不是安全漏洞。
          required: true
